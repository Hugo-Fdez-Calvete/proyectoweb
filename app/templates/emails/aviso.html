<!DOCTYPE html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>{{ subject }}</title></head>
<body style="margin:0;padding:0;background:#f7ede8;font-family:Arial,Helvetica,sans-serif;color:#1e140e;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f7ede8;padding:24px 12px;">
    <tr><td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border-radius:14px;border:1px solid #ead8cf;">
        <tr><td style="padding:22px 28px 8px;">
          <span style="display:inline-block;font-weight:bold;font-size:18px;letter-spacing:2px;color:#1e140e;">HF<span style="color:#90450e;">C</span></span>
        </td></tr>
        <tr><td style="padding:8px 28px 4px;">
          <h1 style="margin:0 0 14px;font-size:20px;line-height:1.3;color:#1e140e;">{{ subject }}</h1>
          <p style="margin:0 0 12px;font-size:15px;line-height:1.6;">{{ greeting }}</p>
          {% for line in lines %}
          <p style="margin:0 0 12px;font-size:15px;line-height:1.6;">{{ line }}</p>
          {% endfor %}
        </td></tr>
        {% if link %}
        <tr><td style="padding:10px 28px 22px;">
          <a href="{{ link }}" style="display:inline-block;background:#90450e;color:#ffffff;text-decoration:none;font-weight:bold;padding:12px 20px;border-radius:10px;font-size:15px;">{{ link_text }}</a>
        </td></tr>
        {% endif %}
        <tr><td style="padding:16px 28px 22px;border-top:1px solid #f1e3dc;font-size:12px;line-height:1.5;color:#755c54;">
          Recibes este correo porque tienes activados los avisos en hugofernandezcalvete.es.
          Puedes cambiarlos en <a href="{{ profile_url }}" style="color:#90450e;">tu perfil</a>.
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
