{% extends "base.html" %}
{% block content %}
<section class="section mt-6">
    <div class="container mt-6">
        <div class="columns is-centered">
            <div class="column is-4-desktop is-6-tablet">
                <div class="box">
                    <div class="has-text-centered mb-5">
                        <h1 class="title is-3">Crear cuenta</h1>
                    </div>
                    <form method="POST" action="{{url_for('home_bp.register')}}">
                        <!-- Nombre de usuario -->
                        <div class="field">
                            <label class="label" for="username">
                                Nombre de usuario
                            </label>
                            <div class="control">
                                <input class="input" type="text" id="username" name="username"
                                    placeholder="Elige un nombre de usuario" autocomplete="username" minlength="3"
                                    required>
                            </div>
                        </div>
                        <!-- Correo electrónico -->
                        <div class="field">
                            <label class="label" for="email">
                                Correo electrónico
                                <span class="has-text-grey is-size-7">
                                    (opcional)
                                </span>
                            </label>

                            <div class="control">
                                <input class="input" type="email" id="email" name="email"
                                    placeholder="correo@ejemplo.com" autocomplete="email">
                            </div>
                        </div>
                        <!-- Número de teléfono -->
                        <div class="field">
                            <label class="label" for="phone">
                                Número de teléfono
                                <span class="has-text-grey is-size-7">
                                    (opcional)
                                </span>
                            </label>
                            <div class="control">
                                <input class="input" type="tel" id="phone" name="phone" placeholder="+34 123 456 789"
                                    autocomplete="tel">
                            </div>
                        </div>
                        <!-- Contraseña -->
                        <div class="field">
                            <label class="label" for="password">
                                Contraseña
                            </label>
                            <div class="control">
                                <input class="input" type="password" id="password" name="password"
                                    placeholder="Crea una contraseña" autocomplete="new-password" minlength="8"
                                    required>
                            </div>
                            <p class="help">
                                Mínimo 8 caracteres.
                            </p>
                        </div>
                        <!-- Confirmar contraseña -->
                        <div class="field">
                            <label class="label" for="password_confirm">
                                Repetir contraseña
                            </label>
                            <div class="control">
                                <input class="input" type="password" id="password_confirm" name="password_confirm"
                                    placeholder="Repite tu contraseña" autocomplete="new-password" minlength="8"
                                    required>
                            </div>
                        </div>
                        <!-- Botón -->
                        <div class="field mt-5">
                            <div class="control">
                                <button class="button is-primary is-outlined is-fullwidth" type="submit">Crear cuenta</button>
                            </div>
                        </div>
                    </form>
                    <!-- Enlace al login -->
                    <div class="has-text-centered mt-5">
                        <p>
                            ¿Ya tienes una cuenta?
                            <a href="{{url_for('home_bp.login')}}">
                                Inicia sesión
                            </a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
