<!DOCTYPE html>
<html lang="es">
<script src="{{url_for('static', filename='js/navbar.js')}}"></script>

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{{url_for('static', filename='img/cloud.png')}}">
    <title>{% block title %}La Nube{% endblock %}</title>

    <!-- CSS - Navbar -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main_nav.css') }}">

    <!-- Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{url_for('static', filename='css/styles.css')}}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="is-flex is-flex-direction-column" style="min-height: 100vh;">

    <nav class="wrapper">
        <!-- Inicio -->
        <a href="{{ url_for('home_bp.index') }}" {% if request.endpoint=='home_bp.index' %}class="active" {% endif %}>
            <strong>Home Cloud</strong>
        </a>

        {% if session.get("is_admin") %}
            <a href="{{ url_for('admin_bp.admin') }}" {% if request.endpoint=='admin_bp.admin' %}class="active" {% endif %}>Administración</a>
        {% endif %}

        {% if session.get('user_id') %}
        <!-- Mis archivos -->
        <a href="{{ url_for('dashboard_bp.dashboard') }}" {% if request.endpoint=='dashboard_bp.dashboard' %}class="active" {% endif %}>Mis archivos</a>
        <!-- Cerrar sesión -->
        <a href="{{ url_for('home_bp.logout') }}">Cerrar sesión</a>

        {% else %}
        <!-- Iniciar sesión -->
        <a href="{{ url_for('home_bp.login') }}" {% if request.endpoint=='home_bp.login' %}class="active" {% endif %}>
            Iniciar sesión
        </a>

        <!-- Crear cuenta -->
        <a href="{{ url_for('home_bp.register') }}" {% if request.endpoint=='home_bp.register' %}class="active" {% endif
            %}>
            Crear cuenta
        </a>
        {% endif %}
    </nav>

    <main class="is-flex-grow-1">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-portada has-text-centered">
        <p>La Nube - Proyecto Personal&copy; 2026</p>
    </footer>
</body>

</html>
