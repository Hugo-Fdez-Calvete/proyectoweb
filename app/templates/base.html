<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="{{url_for('static', filename='img/cloud.png')}}">

    <!-- CSS - Navbar -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main_nav.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cv_button.css') }}">

    <!-- Bulma -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme_toggle.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
</head>

<body class="is-flex is-flex-direction-column" style="min-height: 100vh;">

    <nav class="wrapper">
        {% if request.path.rstrip('/') != '/cv' %}
        <a href="{{ url_for('cv_bp.curriculum') }}" {% if request.endpoint=='cv_bp.curriculum' %} class="active" {% endif %}>
            <span>INFO</span>
        </a>
        {% endif %}
        <!-- Inicio -->
        <a href="{{ url_for('home_bp.index') }}" {% if request.endpoint=='home_bp.index' %} class="active" {% endif %}>
            <strong>HFC</strong>
        </a>

        {% if session.get("is_admin") %}
            <a href="{{ url_for('admin_bp.admin') }}" {% if request.endpoint=='admin_bp.admin' %} class="active" {% endif %}>Administración</a>
        {% endif %}

        {% if session.get('user_id') %}
        <!-- Mis archivos -->
        <a href="{{ url_for('dashboard_bp.dashboard') }}" {% if request.endpoint=='dashboard_bp.dashboard' %} class="active" {% endif %}>Mis archivos</a>
        <!-- Cerrar sesión -->
        <a href="{{ url_for('home_bp.logout') }}">Cerrar sesión</a>

        {% else %}
        <!-- Iniciar sesión -->
        <a href="{{ url_for('home_bp.login') }}" {% if request.endpoint=='home_bp.login' %} class="active" {% endif %}>
            Iniciar sesión
        </a>

        <!-- Crear cuenta -->
        <a href="{{ url_for('home_bp.register') }}" {% if request.endpoint=='home_bp.register' %} class="active" {% endif%}>
            Crear cuenta
        </a>
        {% endif %}
    </nav>

    <main class="is-flex-grow-1">
        {% block content %}{% endblock %}
    </main>
    <script>window.hfTheme && hfTheme.paint();</script>

    <footer class="footer-portada has-text-centered">
        <p> Proyecto Personal&copy; 2026</p>
    </footer>
    <button class="hf-theme-toggle" type="button" aria-pressed="false" aria-label="Cambiar a modo claro">
        <i class="fa-solid fa-sun icon-sun"></i>
        <i class="fa-solid fa-moon icon-moon"></i>
        <span class="hf-theme-label">Modo claro</span>
    </button>
</body>

</html>
