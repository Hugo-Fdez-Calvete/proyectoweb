services:
  flaskapp:
    build: .
    image: proyectoweb:latest
    container_name: proyectoweb_container
    restart: always
    pull_policy: build

    environment:
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY no configurada}"
      # Opcional: Google para /pulso (iniciar sesión y vincular YouTube / YouTube Music)
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      # Opcional: avisos por correo (Gmail con contraseña de aplicación)
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
      MAIL_FROM_NAME: "${MAIL_FROM_NAME:-HFC · Home Cloud}"

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - flask_data:/app/app/data
      - flask_cloud:/app/app/cloud
      - flask_groups:/app/app/cloud_groups
      - flask_sessions:/app/.flask_session

volumes:
  flask_data:
  flask_cloud:
  flask_groups:
  flask_sessions:
