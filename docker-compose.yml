services:
  flaskapp:
    build: .
    image: proyectoweb:latest
    container_name: proyectoweb_container
    restart: always
    pull_policy: build

    environment:
      SECRET_KEY="${SECRET_KEY:?SECRET_KEY no configurada}"

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - flask_data:/app/app/data
      - flask_cloud:/app/app/cloud
      - flask_sessions:/app/.flask_session

volumes:
  flask_data:
  flask_cloud:
  flask_sessions:
