services:
  flaskapp:
    build: .
    image: proyectoweb:latest
    container_name: proyectoweb_container
    restart: always
    pull_policy: build
    ports:
      - "5000:5000"
    volumes:
      # Base de datos SQLite (/app/app/database/users.db)
      - flask_data:/app/app/database
      # Archivos subidos por los usuarios (/app/app/cloud)
      - flask_cloud:/app/app/cloud
      # Sesiones de Flask-Session
      - flask_sessions:/app/.flask_session

volumes:
  flask_data:
  flask_cloud:
  flask_sessions:
