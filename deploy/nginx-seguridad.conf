# =====================================================================
#  Nginx de la Raspberry Pi para hugofernandezcalvete.es
#  (configuración aplicada el 24-11-2026; el bloque /ws/ es para el chat de los grupos)
#
#  Son dos archivos del host, no del contenedor:
#    1) /etc/nginx/sites-available/hugofernandez   (enlazado en sites-enabled)
#    2) /etc/nginx/conf.d/cloudflare-realip.conf
#  Después de cambiarlos:
#      sudo nginx -t && sudo systemctl reload nginx
# =====================================================================


# ---------------------------------------------------------------------
# 1) /etc/nginx/sites-available/hugofernandez
# ---------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name hugofernandezcalvete.es hugofdezraspi.duckdns.org;
    server_tokens off;

    # Reto de Let's Encrypt (renovación automática)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name hugofernandezcalvete.es hugofdezraspi.duckdns.org;

    ssl_certificate     /etc/letsencrypt/live/hugofernandezcalvete.es-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hugofernandezcalvete.es-0001/privkey.pem;

    # No anunciar la versión de Nginx
    server_tokens off;

    # Solo HTTPS durante un año (sin includeSubDomains: no obliga a los subdominios)
    add_header Strict-Transport-Security "max-age=31536000" always;
    # La web no usa cámara, micrófono ni ubicación (display-capture se deja: Pulso lo usa)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # X-Frame-Options (SAMEORIGIN), X-Content-Type-Options y Referrer-Policy los pone Flask

    # La app sube archivos (HomeCloud): por defecto Nginx limita a 1 MB
    client_max_body_size 1g;

    # La Nube: las URLs llevan el nombre del archivo (notas.log, backup.sql...),
    # así que esta ruta no pasa por los filtros de abajo (^~ los salta)
    location ^~ /HomeCloud/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 300;
    }

    # Chat de los grupos (WebSocket). Sin este bloque el chat sigue
    # funcionando, pero consultando cada pocos segundos en vez de en directo.
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_buffering off;
        # el navegador manda un «ping» cada 25 s; esto es solo el máximo de silencio
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }

    # Archivos ocultos (.env, .git, .vscode...): fuera, salvo .well-known
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # Ruido de bots: PHP, WordPress y archivos de configuración que aquí no existen
    location ~* \.(php\d?|asp|aspx|jsp|cgi|env|ini|log|bak|sql|sqlite|db|conf|ya?ml|properties|hcl|ovpn)$ {
        return 404;
    }
    location ~* ^/(wp-admin|wp-content|wp-includes|vendor|storage|\.?config)/ {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_read_timeout 300;
    }
}


